apply plugin: 'com.android.application'

def releaseSigningPropertiesFile = rootProject.file('keystore.properties')
def releaseSigningProperties = new Properties()
if (releaseSigningPropertiesFile.exists()) {
    releaseSigningPropertiesFile.withInputStream { releaseSigningProperties.load(it) }
}

def releaseSigningValues = [
    storeFile: System.getenv('TENNISMATE_UPLOAD_STORE_FILE') ?: releaseSigningProperties.getProperty('storeFile'),
    storePassword: System.getenv('TENNISMATE_UPLOAD_STORE_PASSWORD') ?: releaseSigningProperties.getProperty('storePassword'),
    keyAlias: System.getenv('TENNISMATE_UPLOAD_KEY_ALIAS') ?: releaseSigningProperties.getProperty('keyAlias'),
    keyPassword: System.getenv('TENNISMATE_UPLOAD_KEY_PASSWORD') ?: releaseSigningProperties.getProperty('keyPassword'),
]
def releaseSigningAvailable = releaseSigningValues.values().every { value -> value?.trim() }

android {
    namespace "com.tennismate.app"
    compileSdk rootProject.ext.compileSdkVersion
    signingConfigs {
        if (releaseSigningAvailable) {
            release {
                storeFile rootProject.file(releaseSigningValues.storeFile)
                storePassword releaseSigningValues.storePassword
                keyAlias releaseSigningValues.keyAlias
                keyPassword releaseSigningValues.keyPassword
            }
        }
    }
    defaultConfig {
        applicationId "com.tennismate.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 5
        versionName "1.0.4"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (releaseSigningAvailable) {
                signingConfig signingConfigs.release
            }
        }
    }
}

gradle.taskGraph.whenReady { taskGraph ->
    def requiresReleaseSigning = taskGraph.allTasks.any { task ->
        task.project == project && task.name in ['bundleRelease', 'assembleRelease']
    }
    if (requiresReleaseSigning && !releaseSigningAvailable) {
        throw new GradleException(
            'Release signing is not configured. Set the TENNISMATE_UPLOAD_* environment variables ' +
            'or create the ignored android/keystore.properties file.'
        )
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    implementation platform('com.google.firebase:firebase-bom:33.5.1')
    implementation 'com.google.firebase:firebase-messaging'
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
